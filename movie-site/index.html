<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie Details</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1f6;--card:#fff;--text:#1d1626;--muted:#6b6275;--accent:#c2341f;--line:#ddd7e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1322;--card:#261c31;--text:#f1e9f5;--muted:#a999b5;--accent:#ff7a5c;--line:#3a2d48}}
:root[data-theme="dark"]{--bg:#1a1322;--card:#261c31;--text:#f1e9f5;--muted:#a999b5;--accent:#ff7a5c;--line:#3a2d48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
header{max-width:1000px;margin:0 auto;padding:28px 18px 8px}
h1{font-size:2rem;margin:0 0 12px;letter-spacing:-.01em}
input{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{max-width:1000px;margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.item{all:unset;cursor:pointer;display:block}
.item:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
.item img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.item b{display:block;margin-top:8px;font-size:1rem}
.item span{color:var(--muted);font-size:.9rem}
dialog{border:0;border-radius:12px;padding:0;max-width:min(720px,94vw);width:100%;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.d{display:grid;grid-template-columns:minmax(120px,240px) 1fr;gap:22px;padding:22px}
.d img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px}
.d h2{margin:0 0 4px;font-size:1.6rem}
.meta{color:var(--muted);margin:0 0 12px}
.rate{display:inline-block;background:var(--accent);color:#fff;font-weight:bold;padding:2px 10px;border-radius:99px;margin-bottom:12px}
.d dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.d dt{color:var(--muted)}.d dd{margin:0}
.x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--text);font-size:1.8rem;cursor:pointer}
.none{padding:18px;max-width:1000px;margin:0 auto;color:var(--muted)}
@media (max-width:520px){.d{grid-template-columns:1fr}.d img{max-width:200px}}
</style>
</head>
<body>
<header>
<h1>Movie details</h1>
<input id="q" type="search" placeholder="Search by title, director or genre" aria-label="Search movies">
</header>
<main id="grid" class="grid"></main>
<p id="none" class="none" hidden>No movie matches that search. Try a title or director.</p>
<dialog id="dlg" aria-label="Movie details">
<button class="x" id="close" aria-label="Close">×</button>
<div class="d" id="detail"></div>
</dialog>
<script>
// Add a real image link in `poster` (e.g. "posters/inception.jpg") when you run this on your own computer.
// If `poster` is empty, a generated poster is shown instead.
const movies=[
{title:"Inception",year:2010,director:"Christopher Nolan",runtime:148,genre:"Sci-Fi, Thriller",rating:8.8,cast:"Leonardo DiCaprio, Joseph Gordon-Levitt, Elliot Page",plot:"A thief who steals secrets from people’s dreams is offered a chance to plant an idea in a target’s mind instead.",hue:215,poster:"posters/Inception.jpeg"},
{title:"The Dark Knight",year:2008,director:"Christopher Nolan",runtime:152,genre:"Action, Crime",rating:9.0,cast:"Christian Bale, Heath Ledger, Aaron Eckhart",plot:"Batman faces the Joker, a criminal mastermind who pushes Gotham City into chaos.",hue:260,poster:"posters/darkknight.jpeg"},
{title:"Interstellar",year:2014,director:"Christopher Nolan",runtime:169,genre:"Sci-Fi, Adventure",rating:8.7,cast:"Matthew McConaughey, Anne Hathaway, Jessica Chastain",plot:"With Earth dying, a team of explorers travels through a wormhole to find humanity a new home.",hue:30,poster:"posters/interstellar.jpeg"},
{title:"3 Idiots",year:2009,director:"Rajkumar Hirani",runtime:170,genre:"Comedy, Drama",rating:8.4,cast:"Aamir Khan, R. Madhavan, Sharman Joshi",plot:"Two friends search for their long-lost college buddy, recalling how he challenged the way engineering students were taught.",hue:170,poster:"posters/3idiots.jpeg"},
{title:"Dangal",year:2016,director:"Nitesh Tiwari",runtime:161,genre:"Biography, Sports",rating:8.3,cast:"Aamir Khan, Fatima Sana Shaikh, Sanya Malhotra",plot:"Former wrestler Mahavir Singh Phogat trains his daughters to become world-class wrestlers.",hue:10,poster:"posters/dangal.jpeg"},
{title:"Parasite",year:2019,director:"Bong Joon-ho",runtime:132,genre:"Thriller, Drama",rating:8.5,cast:"Song Kang-ho, Choi Woo-shik, Park So-dam",plot:"A poor family schemes its way into the lives of a wealthy household, with unexpected consequences.",hue:140,poster:"posters/parasite.jpeg"}
];
const grid=document.getElementById("grid"),none=document.getElementById("none"),dlg=document.getElementById("dlg"),detail=document.getElementById("detail");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function poster(m){
 if(m.poster)return m.poster;
 const words=m.title.split(" "),lines=[];let cur="";
 words.forEach(w=>{if((cur+" "+w).trim().length>11){lines.push(cur);cur=w}else cur=(cur+" "+w).trim()});lines.push(cur);
 const t=lines.map((l,i)=>`<text x="30" y="${300+i*44}" font-size="38" font-weight="700" fill="#fff" font-family="Georgia,serif">${esc(l)}</text>`).join("");
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${m.hue},55%,45%)"/><stop offset="1" stop-color="hsl(${m.hue},60%,12%)"/></linearGradient></defs><rect width="300" height="450" fill="url(#g)"/><circle cx="215" cy="120" r="60" fill="hsl(${m.hue},70%,70%)" opacity=".35"/>${t}<text x="30" y="420" font-size="18" fill="#fff" opacity=".8" font-family="Georgia,serif">${m.year}</text></svg>`;
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function render(list){
 grid.innerHTML="";none.hidden=list.length>0;
 list.forEach(m=>{
  const b=document.createElement("button");b.className="item";
  b.innerHTML=`<img src="${poster(m)}" alt="Poster of ${esc(m.title)}"><b>${esc(m.title)}</b><span>${m.year} · ★ ${m.rating}</span>`;
  b.onclick=()=>show(m);grid.appendChild(b);
 });
}
function show(m){
 detail.innerHTML=`<img src="${poster(m)}" alt="Poster of ${esc(m.title)}"><div><h2>${esc(m.title)}</h2><p class="meta">${m.year} · ${m.runtime} min · ${esc(m.genre)}</p><span class="rate">★ ${m.rating}</span><p>${esc(m.plot)}</p><dl><dt>Director</dt><dd>${esc(m.director)}</dd><dt>Cast</dt><dd>${esc(m.cast)}</dd></dl></div>`;
 dlg.showModal();
}
document.getElementById("close").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.getElementById("q").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase().trim();
 render(movies.filter(m=>(m.title+m.director+m.genre).toLowerCase().includes(q)));
});
render(movies);
</script>
</body>
</html>
